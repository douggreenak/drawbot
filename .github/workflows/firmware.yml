name: Build firmware

# Compiles Marlin with the Drawbot patch for each Creality board and publishes ONE zip (a folder per board)
# as an asset of the "latest" release (the web app's Firmware card links to them).
on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  schedule:
    - cron: '0 6 * * 1'        # weekly: pick up upstream Marlin changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: CrealityV1,   pkg: 1.1.x-8bit, env: melzi }
          - { board: CrealityV422, pkg: 4.2.2,      env: STM32F103RC_creality }   # 256 KB build: runs on RCT6 and RET6 chips
          - { board: CrealityV427, pkg: 4.2.7,      env: STM32F103RC_creality }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install platformio
      - name: Get Marlin and the stock Ender-3 config
        run: |
          git clone --depth 1 -b bugfix-2.1.x https://github.com/MarlinFirmware/Marlin.git Marlin
          B=https://raw.githubusercontent.com/MarlinFirmware/Configurations/bugfix-2.1.x/config/examples/Creality/Ender-3/${{ matrix.board }}
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 $B/Configuration.h     -o Marlin/Marlin/Configuration.h
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 $B/Configuration_adv.h -o Marlin/Marlin/Configuration_adv.h
          # the stock config includes custom boot/status screens that must sit next to it
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 $B/_Bootscreen.h   -o Marlin/Marlin/_Bootscreen.h
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 $B/_Statusscreen.h -o Marlin/Marlin/_Statusscreen.h
      - name: Apply the Drawbot patch
        run: python3 firmware/apply_drawbot.py Marlin
      - name: Build
        run: pio run -d Marlin -e ${{ matrix.env }}
      - name: Package this board
        run: |
          mkdir -p out/${{ matrix.pkg }}
          STAMP=$(date -u +%Y%m%d%H%M)
          if [ "${{ matrix.board }}" = "CrealityV1" ]; then
            cp Marlin/.pio/build/${{ matrix.env }}/firmware.hex out/${{ matrix.pkg }}/drawbot-1.1.x.hex
            cp firmware/sd-card/FLASHING-1.1.x.txt out/${{ matrix.pkg }}/READ-ME.txt
          else
            # the Creality bootloader only flashes a .bin whose name differs from the one already installed
            cp Marlin/.pio/build/${{ matrix.env }}/firmware-*.bin out/${{ matrix.pkg }}/drawbot-${{ matrix.pkg }}-$STAMP.bin
            cp firmware/sd-card/FLASHING-4.2.x.txt out/${{ matrix.pkg }}/READ-ME.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.pkg }}
          path: out/${{ matrix.pkg }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Assemble the single download
        run: |
          mkdir -p all
          for d in dist/fw-*; do mkdir -p "all/$(basename "$d" | sed 's/^fw-/Board-/')" && cp -r "$d"/. "all/$(basename "$d" | sed 's/^fw-/Board-/')/"; done
          cp firmware/sd-card/READ-ME-FIRST.txt firmware/sd-card/pen-test-*.gcode all/
          (cd all && zip -qr ../drawbot-firmware-all.zip .)
      - name: Publish to the "latest" release (created the first time, the zip is replaced afterwards)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --title "Latest firmware" \
              --notes "Marlin bugfix-2.1.x patched for Drawbot. One zip for every supported board: open the folder that matches your board. Built by CI; not tested on hardware."
          gh release upload latest drawbot-firmware-all.zip --clobber --repo "$GITHUB_REPOSITORY"
